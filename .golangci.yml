run:
  timeout: 1m
  tests: true

output:
  formats:
    - format: colored-line-number
  print-linter-name: true

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  gofmt:
    simplify: true
  gocyclo:
    min-complexity: 10
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  lll:
    line-length: 140
  nakedret:
    max-func-lines: 30

linters:
  enable:
    - gosimple
    - staticcheck
    - unused
    - govet
    - errcheck
    - gosec
    - ineffassign
    - typecheck
    - unconvert
    - gocyclo
    - gofmt
    - misspell
    - lll
    - nakedret
  disable:
    - depguard
    - prealloc
    - dupl

issues:
  exclude-use-default: false
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - gocyclo
